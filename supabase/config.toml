# ---------------------------------------------------------------------------
# Seed functions (owner-only, invoked from AdminPanel via supabase.functions.invoke,
# which sends the signed-in admin's JWT — so verify_jwt = true both works and
# keeps the service-role scripts from being callable by anonymous clients).
# ---------------------------------------------------------------------------
[functions.seed-jamb-questions]
verify_jwt = true

[functions.seed-extra-questions]
verify_jwt = true

[functions.seed-low-count-subjects]
verify_jwt = true

[functions.seed-all-subjects]
verify_jwt = true

# ---------------------------------------------------------------------------
# Public / self-authenticating functions.
# verify_jwt = false here is deliberate: each validates its own input
# (Paystack signature, client-supplied session, or intentionally public data).
# ---------------------------------------------------------------------------
[functions.generate-topic-content]
verify_jwt = false

[functions.generate-study-tip]
verify_jwt = false

[functions.chat]
verify_jwt = false

[functions.jamb-news]
verify_jwt = false

[functions.paystack-config]
verify_jwt = false

[functions.paystack-initialize]
verify_jwt = false

[functions.paystack-verify]
verify_jwt = false

[functions.paystack-webhook]
verify_jwt = false

[functions.process-upload]
verify_jwt = false

[functions.auto-confirm]
verify_jwt = false

[functions.send-whatsapp-reminder]
verify_jwt = false

[functions.b2b-register-buyer]
verify_jwt = false

[functions.b2b-initialize-order]
verify_jwt = false

[functions.b2b-verify-order]
verify_jwt = false

[functions.b2b-get-pins]
verify_jwt = false

[functions.b2b-redeem-pin]
verify_jwt = false

[functions.b2b-admin-manage]
verify_jwt = false

# ---------------------------------------------------------------------------
# Previously present in supabase/functions/ but missing from this file, so they
# silently inherited the default verify_jwt = true.
# ---------------------------------------------------------------------------
# Invoked by pg_cron from a migration (net.http_post sends no JWT) — must be
# callable without one, otherwise the scheduled job is rejected.
[functions.daily-educational-notification]
verify_jwt = false

[functions.generate-study-plan]
verify_jwt = true

# Called from TimedQuiz with the signed-in user's token.
[functions.update-leaderboard]
verify_jwt = true

[functions.enrich-novel-chapters]
verify_jwt = true

[functions.seed-novel-chapters]
verify_jwt = true

[functions.import-aloc-questions]
verify_jwt = true

[functions.generate-question-batch]
verify_jwt = true

[functions.import-scraped-questions]
verify_jwt = true

[functions.prune-questions]
verify_jwt = true

[functions.send-test-email]
verify_jwt = true
